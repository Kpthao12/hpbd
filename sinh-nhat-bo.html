<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc mừng sinh nhật bố!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800;900&family=Patrick+Hand&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  --navy:#1b2a4e; --navy-d:#0f1a33; --navy-l:#2e4377;
  --sky:#c9d6ee; --sky-l:#e8eef9; --white:#ffffff; --paper:#f6f8fc;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Be Vietnam Pro',sans-serif;background:var(--paper);color:var(--navy);
  overflow:hidden;-webkit-tap-highlight-color:transparent;transition:background .8s ease;
}
body.sky{background:var(--sky-l)}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .7s ease, transform .7s ease;transform:scale(.97)}
.stage.on{opacity:1;pointer-events:auto;transform:scale(1)}

/* ---------- stage 1 : emblem ---------- */
#s1{flex-direction:column;cursor:pointer}
.emblem{width:min(86vw,520px);animation:bob 3s ease-in-out infinite}
.emblem svg{width:100%;height:auto;display:block;overflow:visible}
.emblem:hover{filter:brightness(1.05)}
.arc-text{font-family:'Be Vietnam Pro';font-weight:900;font-size:40px;fill:var(--navy);letter-spacing:1px}
.hint{margin-top:18px;font-size:clamp(14px,3.6vw,17px);color:var(--navy-l);opacity:.85;animation:blink 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
#s1.opening .emblem{animation:zoomout .7s ease forwards}
@keyframes zoomout{to{transform:scale(1.25);opacity:0}}

/* ---------- stage 2 : card ---------- */
.card-wrap{position:relative;width:min(90vw,640px)}
.card{
  position:relative;background:var(--navy);color:var(--white);border-radius:22px;
  padding:clamp(22px,5vw,40px) clamp(22px,5vw,44px) clamp(26px,5vw,36px);
  font-family:'Patrick Hand',cursive;font-size:clamp(19px,4.4vw,25px);line-height:1.45;
  transform:rotate(-2deg);box-shadow:0 18px 40px rgba(15,26,51,.28);
  animation:cardIn .8s cubic-bezier(.2,1.4,.4,1) both;
}
.card::before{content:"";position:absolute;inset:10px;border:2px dashed rgba(255,255,255,.28);border-radius:15px;pointer-events:none}
@keyframes cardIn{from{transform:rotate(-12deg) translateY(60px) scale(.8);opacity:0}}
.field{opacity:.75}
.field b{font-weight:400;opacity:1;color:var(--white)}
.msg-label{margin-top:12px;opacity:.75}
.msg{font-size:1.15em;margin:2px 0 18px;padding-right:12%}
.attach{display:block;margin:0 auto;background:none;border:none;color:var(--white);font-family:inherit;font-size:.9em;
  text-decoration:underline;text-underline-offset:5px;cursor:pointer;padding:6px 12px;border-radius:10px;transition:background .2s}
.attach:hover{background:rgba(255,255,255,.12)}
.attach .clip{display:inline-block;animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}
.stk{position:absolute;z-index:3;pointer-events:none}
.stk-face{top:-38px;right:-14px;width:clamp(78px,17vw,112px);aspect-ratio:1;background:var(--white);padding:6px;border-radius:12px;
  transform:rotate(9deg);box-shadow:0 6px 16px rgba(0,0,0,.25);animation:pop .6s .5s both}
.stk-face img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.stk-pixel{left:-26px;bottom:18px;width:clamp(54px,12vw,78px);transform:rotate(-8deg);image-rendering:pixelated;
  filter:drop-shadow(0 0 0 #fff) drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 5px 8px rgba(0,0,0,.25));
  animation:pop .6s .7s both}
.stk-burst{right:-18px;bottom:-26px;width:clamp(84px,18vw,112px);animation:pop .6s .9s both}
@keyframes pop{from{transform:scale(0) rotate(-30deg);opacity:0}}

/* ---------- stage 3 : letter ---------- */
#s3{background:var(--navy);color:var(--white);align-items:stretch;justify-content:stretch}
.corner{position:absolute;top:0;left:0;width:min(34vw,200px);opacity:.9;pointer-events:none}
.corner2{position:absolute;bottom:0;right:0;width:min(28vw,160px);opacity:.5;transform:rotate(180deg);pointer-events:none}
.letter-layout{position:relative;margin:auto;width:min(94vw,980px);max-height:100%;display:flex;align-items:center;gap:clamp(18px,4vw,56px);
  padding:clamp(70px,10vh,90px) clamp(10px,3vw,30px) clamp(30px,6vh,60px)}
.portrait{flex:0 0 auto;position:relative;width:clamp(120px,26vw,230px);aspect-ratio:1;animation:pop .7s .2s both}
.portrait .ph{width:100%;height:100%;border-radius:50%;border:6px solid var(--white);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.portrait .ph img{width:100%;height:100%;object-fit:cover;display:block}
.hat{position:absolute;left:50%;top:-34%;width:46%;transform:translateX(-30%) rotate(14deg);transform-origin:bottom center;animation:hatbob 2.4s ease-in-out infinite}
@keyframes hatbob{0%,100%{transform:translateX(-30%) rotate(14deg)}50%{transform:translateX(-30%) rotate(6deg)}}
.deco{position:absolute;font-size:clamp(22px,5vw,34px);animation:twinkle 2s ease-in-out infinite}
.deco.d1{left:-18%;top:30%}
.deco.d2{right:-14%;top:4%;animation-delay:.6s}
.deco.d3{right:-12%;bottom:-6%;font-size:clamp(28px,6vw,42px);animation-delay:1.1s}
.deco.d4{left:-6%;bottom:-10%;animation-delay:.3s}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(12deg)}}
.letter{flex:1;font-family:'Patrick Hand',cursive;font-size:clamp(19px,2.6vw,27px);line-height:1.55;min-height:8em;cursor:pointer}
.letter p{margin-bottom:.6em}
.letter .greet{font-size:1.1em;color:var(--sky)}
.letter .sign{text-align:right;color:var(--sky);margin-top:.3em}
.caret{display:inline-block;width:2px;height:1em;background:var(--white);vertical-align:-0.15em;margin-left:2px;animation:blink 0.9s steps(1) infinite}
.next{position:absolute;right:clamp(16px,4vw,44px);bottom:clamp(16px,4vh,34px);background:none;border:none;color:var(--white);
  font-family:'Patrick Hand',cursive;font-size:clamp(19px,4vw,24px);text-decoration:underline;text-underline-offset:5px;cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity .6s, transform .2s;padding:6px 10px}
.next.show{opacity:1;pointer-events:auto;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.skip{position:absolute;left:50%;bottom:clamp(10px,2vh,18px);transform:translateX(-50%);font-size:13px;opacity:.45;font-family:'Be Vietnam Pro'}

/* ---------- stage 4 : happy birthday ---------- */
#s4{flex-direction:column;background:var(--white)}
.hb{position:relative;width:min(94vw,820px);text-align:center}
.big{font-weight:900;color:var(--navy);line-height:.98;letter-spacing:-.01em;text-transform:uppercase;
  -webkit-text-stroke:0;text-shadow:3px 3px 0 var(--sky),6px 6px 0 rgba(27,42,78,.12)}
.big .line{display:block;white-space:nowrap}
.big .l1{font-size:clamp(30px,8.4vw,86px)}
.big .l2{font-size:clamp(38px,10.8vw,118px)}
.big .l3{font-size:clamp(52px,15vw,138px);color:var(--navy-l)}
.ch{display:inline-block;opacity:0;transform:translateY(40px) scale(.3) rotate(var(--r));animation:letterIn .55s cubic-bezier(.2,1.6,.4,1) forwards;animation-delay:var(--d)}
@keyframes letterIn{to{opacity:1;transform:translateY(0) scale(1) rotate(var(--r))}}
.polaroid{position:absolute;background:var(--white);padding:7px 7px 26px;box-shadow:0 10px 26px rgba(15,26,51,.25);z-index:2;animation:pop .7s both}
.polaroid img{display:block;width:100%;object-fit:cover}
.polaroid span{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:'Patrick Hand';font-size:15px;color:var(--navy)}
.pol-a{width:clamp(150px,27vw,250px);right:-10%;top:-52%;transform:rotate(7deg);animation-delay:1.6s}
.pol-a img,.pol-c img{aspect-ratio:16/9;object-fit:cover}
.pol-c{width:clamp(140px,24vw,220px);left:-10%;top:-46%;transform:rotate(-7deg);animation-delay:2.1s}
.pol-b{width:clamp(70px,13vw,112px);left:-2%;bottom:-36%;transform:rotate(-9deg);animation-delay:1.9s;background:var(--sky-l)}
.pol-b img{image-rendering:pixelated;aspect-ratio:auto;padding:8px 10px 0}
.sticker-face{position:absolute;left:2%;top:-30%;width:clamp(64px,13vw,108px);aspect-ratio:1;border-radius:50%;border:5px solid var(--white);
  box-shadow:0 6px 18px rgba(15,26,51,.25);overflow:hidden;animation:pop .7s 2.1s both;z-index:2}
.sticker-face img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;right:4%;bottom:-30%;background:var(--navy);color:var(--white);font-family:'Patrick Hand';font-size:clamp(16px,3.6vw,22px);
  padding:6px 16px;border-radius:999px;transform:rotate(-4deg);animation:pop .7s 2.4s both;z-index:2}
.replay{position:absolute;bottom:clamp(14px,3vh,26px);background:none;border:1.5px solid var(--navy);color:var(--navy);border-radius:999px;
  padding:8px 18px;font-family:'Be Vietnam Pro';font-weight:600;font-size:14px;cursor:pointer;opacity:0;animation:fadein .8s 3s forwards}
.replay:hover{background:var(--navy);color:var(--white)}
@keyframes fadein{to{opacity:1}}
.tap-more{position:absolute;top:clamp(14px,3vh,26px);font-size:13px;color:var(--navy-l);opacity:0;animation:fadein .8s 3.2s forwards}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.cf{position:absolute;top:-20px;width:10px;height:14px;opacity:.95;animation:fall var(--t) linear forwards}
@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(var(--rot))}}

/* narrow screens */
@media (max-width:640px){
  .letter-layout{flex-direction:column;justify-content:center;gap:24px;padding-top:70px;padding-bottom:70px}
  .portrait{width:clamp(110px,34vw,150px);margin-top:20px}
  .letter{min-height:0;width:100%}
  .pol-a{top:auto;bottom:calc(100% + 14px);right:2%;width:46vw}
  .pol-c{top:auto;bottom:calc(100% + 64px);left:2%;width:44vw}
  .pol-b{bottom:auto;top:calc(100% + 18px);left:8%;width:24vw}
  .tag{bottom:auto;top:calc(100% + 46px);right:6%}
}
@media (max-height:560px) and (min-width:641px){
  .letter{font-size:clamp(16px,3.6vh,22px)}
}
</style>
</head>

    <div class="tag">Happy birthday! 🎉</div>
  </div>
  <button class="replay" id="replay">↺ xem lại từ đầu</button>
</section>

<div class="confetti" id="confetti"></div>

<script>
const $ = id => document.getElementById(id);
function go(n){
  document.querySelectorAll('.stage').forEach(s=>s.classList.remove('on'));
  $('s'+n).classList.add('on');
  document.body.classList.toggle('sky', n===2);
}

/* confetti */
const COLORS=['#1b2a4e','#2e4377','#c9d6ee','#ffffff','#8fa8d6','#0f1a33'];
function launchConfetti(count=90, originX=null){
  const layer=$('confetti');
  for(let i=0;i<count;i++){
    const c=document.createElement('i');
    c.className='cf';
    const x = originX===null ? Math.random()*100 : Math.max(0,Math.min(100, originX + (Math.random()-.5)*30));
    c.style.left=x+'vw';
    c.style.background=COLORS[i%COLORS.length];
    if(c.style.background.includes('255, 255, 255')||COLORS[i%COLORS.length]==='#ffffff') c.style.outline='1px solid #c9d6ee';
    c.style.width=(6+Math.random()*8)+'px';
    c.style.height=(8+Math.random()*10)+'px';
    if(Math.random()<.3) c.style.borderRadius='50%';
    c.style.setProperty('--t',(2.4+Math.random()*2.4)+'s');
    c.style.setProperty('--drift',((Math.random()-.5)*40)+'vw');
    c.style.setProperty('--rot',(Math.random()*900-450)+'deg');
    c.style.animationDelay=(Math.random()*.6)+'s';
    layer.appendChild(c);
    setTimeout(()=>c.remove(),6000);
  }
}

/* stage 1 -> 2 */
$('s1').addEventListener('click',()=>{
  $('s1').classList.add('opening');
  launchConfetti(50);
  setTimeout(()=>go(2),600);
});

/* stage 2 -> 3 */
$('toLetter').addEventListener('click',()=>{ go(3); setTimeout(startTyping,700); });

/* typewriter letter */
const PARAS=[
  {cls:'greet', text:'Chúc mừng bố sang tuổi 47!!!'},
  {cls:'', text:'Chúc mừng sinh nhật bố!!!! Thảo chúc bố nhiều sức khoẻ, luôn phong độ, có nhiều may mắn, mọi việc như ý, và công việc thuận lợi hơn nữa ạ!!! 😁😁😁'},
  {cls:'sign', text:'— Thảo 💙'}
];
let typing=false, skipTyping=false;
function startTyping(){
  if(typing) return;
  typing=true; skipTyping=false;
  const box=$('letter'); box.innerHTML='';
  const caret=document.createElement('span'); caret.className='caret';
  let p=0, i=0, el=null;
  const chars = PARAS.map(x=>Array.from(x.text));
  function step(){
    if(skipTyping){
      box.innerHTML='';
      PARAS.forEach(x=>{const e=document.createElement('p'); if(x.cls) e.className=x.cls; e.textContent=x.text; box.appendChild(e);});
      return done();
    }
    if(p>=PARAS.length) return done();
    if(!el){ el=document.createElement('p'); if(PARAS[p].cls) el.className=PARAS[p].cls; box.appendChild(el); el.appendChild(caret); }
    const ch=chars[p][i];
    caret.insertAdjacentText('beforebegin', ch);
    i++;
    let delay = 38 + Math.random()*30;
    if(/[,!.]/.test(ch)) delay=180;
    if(i>=chars[p].length){ p++; i=0; el=null; delay=450; }
    setTimeout(step, delay);
  }
  function done(){
    caret.remove(); typing=false;
    $('toFinal').classList.add('show');
  }
  step();
}
$('letter').addEventListener('click',()=>{ if(typing) skipTyping=true; });

/* stage 3 -> 4 */
function buildBig(){
  const lines=[['CHÚC MỪNG','l1'],['SINH NHẬT','l2'],['BỐ!','l3']];
  const big=$('big'); big.innerHTML='';
  let d=0;
  lines.forEach(([txt,cls])=>{
    const line=document.createElement('span'); line.className='line '+cls;
    Array.from(txt).forEach((ch,k)=>{
      const s=document.createElement('span');
      if(ch===' '){ s.innerHTML='&nbsp;'; s.style.display='inline-block'; line.appendChild(s); return; }
      s.className='ch'; s.textContent=ch;
      s.style.setProperty('--d',(d*0.07+0.2)+'s');
      s.style.setProperty('--r',((k%2?1:-1)*(2+Math.random()*5))+'deg');
      line.appendChild(s); d++;
    });
    big.appendChild(line);
  });
}
$('toFinal').addEventListener('click',()=>{
  go(4); buildBig();
  setTimeout(()=>launchConfetti(140),900);
  setTimeout(()=>launchConfetti(80),2200);
});
$('s4').addEventListener('click',e=>{
  if(e.target.closest('.replay')) return;
  launchConfetti(60, e.clientX/window.innerWidth*100);
});

/* replay */
$('replay').addEventListener('click',()=>{
  $('s1').classList.remove('opening');
  $('toFinal').classList.remove('show');
  $('letter').innerHTML='';
  /* restart stage-4 sticker animations next time */
  document.querySelectorAll('#s4 .polaroid,#s4 .tag,.card,.stk').forEach(el=>{el.style.animation='none'; el.offsetHeight; el.style.animation='';});
  go(1);
});
</script>
</body>
</html>
